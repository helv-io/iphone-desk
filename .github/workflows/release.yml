name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio packaging pillow
          pip install -e . --no-deps
      - name: Test
        run: python -m pytest

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: |
          py -3.12 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dist]"
          .\.venv\Scripts\python.exe -m PyInstaller --noconfirm --clean packaging/iphone-desk.spec
          $ver = "${{ needs.test.outputs.version }}"
          $src = "dist\iPhoneDesk"
          if (-not (Test-Path (Join-Path $src "iPhoneDesk.exe"))) { throw "missing onedir exe" }
          $zip = "dist\iPhoneDesk-$ver-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $src "*") -DestinationPath $zip -Force
          Get-Item $zip | Format-List FullName, Length
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: iPhoneDesk-${{ needs.test.outputs.version }}-windows-x64
          path: dist/iPhoneDesk-*-windows-x64.zip
          if-no-files-found: error

  linux-appimage:
    needs: test
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "1"
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            file \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libwayland-client0 \
            libwayland-cursor0 \
            libwayland-egl1 \
            libxi6 \
            libxrender1
      - name: Build
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          chmod +x packaging/build-appimage.sh
          ./packaging/build-appimage.sh
          test -f "dist/iPhoneDesk-${VERSION}-linux-x86_64.AppImage"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: iPhoneDesk-${{ needs.test.outputs.version }}-linux-x86_64
          path: dist/iPhoneDesk-*-linux-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: [test, windows-exe, linux-appimage]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Confirm both assets
        run: |
          ls -l dist
          test -f "dist/iPhoneDesk-${{ needs.test.outputs.version }}-windows-x64.zip"
          test -f "dist/iPhoneDesk-${{ needs.test.outputs.version }}-linux-x86_64.AppImage"
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: iPhone Desk ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: .github/release-notes.md
          files: |
            dist/iPhoneDesk-*-windows-x64.zip
            dist/iPhoneDesk-*-linux-x86_64.AppImage
          fail_on_unmatched_files: true
