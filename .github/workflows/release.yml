name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio packaging pillow
          pip install -e . --no-deps
      - name: Test
        run: python -m pytest

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        shell: pwsh
        run: |
          py -3.12 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dist]"
          .\.venv\Scripts\python.exe -m PyInstaller --noconfirm --clean packaging/iphone-desk.spec
          $ver = "${{ steps.ver.outputs.name }}"
          $src = "dist\iPhoneDesk.exe"
          $dst = "dist\iPhoneDesk-$ver-windows-x64.exe"
          Copy-Item $src $dst
          Get-Item $dst | Format-List FullName, Length
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneDesk-${{ steps.ver.outputs.name }}-windows-x64
          path: dist/iPhoneDesk-*-windows-x64.exe
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: iPhone Desk ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: .github/release-notes.md
          files: dist/iPhoneDesk-*-windows-x64.exe
          fail_on_unmatched_files: true
