[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iphone-desk"
version = "0.1.0"
description = "Windows desktop viewer and touch client for a trusted, Developer Mode iPhone."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Helvio Pedreschi", email = "helvio88@gmail.com" },
]
keywords = ["iphone", "developer-mode", "pymobiledevice3", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "pymobiledevice3>=10.7.0",
    "PySide6>=6.7.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
hevc = ["PySide6-QtWebEngine>=6.7.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/helv-io/iphone-desk"
Repository = "https://github.com/helv-io/iphone-desk"

[project.scripts]
iphone-desk = "iphone_desk.__main__:main"

[tool.setuptools.packages.find]
include = ["iphone_desk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
